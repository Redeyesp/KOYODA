name: KOYODA Wi-Fi
run-name: KOYODA Wi-Fi ${{ inputs.enable_wifi && 'ON' || 'OFF' }} / ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      enable_wifi:
        description: Enable Wi-Fi using KOYODA_WIFI_SSID and KOYODA_WIFI_PASSWORD secrets
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      SOURCE_SHA: ${{ github.sha }}
      KOYODA_ENABLE_WIFI: ${{ inputs.enable_wifi && 'true' || 'false' }}

    steps:
      - name: Check out selected source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create preservation manifest and run host tests
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          # Create checksum manifest from the exact source selected for this build.
          # Only tracked files are included.
          git ls-files -z -- main assets partitions.csv \
            | sort -z \
            | xargs -0 sha256sum \
            > wifi-preserved.sha256

          test -s wifi-preserved.sha256
          sha256sum -c wifi-preserved.sha256

          python3 tools/test_wifi.py

      - name: Generate private Wi-Fi build input
        shell: bash
        env:
          KOYODA_WIFI_SSID: ${{ secrets.KOYODA_WIFI_SSID }}
          KOYODA_WIFI_PASSWORD: ${{ secrets.KOYODA_WIFI_PASSWORD }}
        run: |
          set -euo pipefail

          if [ "$KOYODA_ENABLE_WIFI" = "true" ]; then

            if [ -z "${KOYODA_WIFI_SSID:-}" ]; then
              echo "::error::KOYODA_WIFI_SSID secret is missing or empty"
              exit 1
            fi

            python3 tools/generate_wifi_secrets.py

          else
            python3 tools/generate_wifi_secrets.py --disabled
          fi

          test -f main/koyoda_wifi_secrets.h

      - name: Build with ESP-IDF 5.5.4
        shell: bash
        run: |
          set -euo pipefail

          trap 'rm -f main/koyoda_wifi_secrets.h' EXIT

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/koyoda-idf-home \
            -e CCACHE_DISABLE=1 \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project \
            espressif/idf:v5.5.4 \
            bash -c 'set -euo pipefail; mkdir -p "$HOME"; idf.py --version; idf.py -B build-ci build' \
            2>&1 | tee koyoda-wifi-build.log

      - name: Verify preserved source and package firmware
        shell: bash
        run: |
          set -euo pipefail

          # Private credentials must already be gone.
          test ! -e main/koyoda_wifi_secrets.h

          # Check that the build did not modify KOYODA source/assets.
          sha256sum -c wifi-preserved.sha256

          git diff --exit-code -- \
            main \
            assets \
            partitions.csv

          python3 tools/package_wifi_firmware.py

      - name: Remove private build input
        if: always()
        shell: bash
        run: |
          rm -f main/koyoda_wifi_secrets.h

      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: KOYODA-WiFi-${{ inputs.enable_wifi && 'ON' || 'OFF' }}-${{ github.run_number }}-IDF-5.5.4
          path: firmware/
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: KOYODA-WiFi-logs-${{ github.run_number }}
          path: koyoda-wifi-build.log
          if-no-files-found: ignore
          retention-days: 7
