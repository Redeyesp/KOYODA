name: KOYODA baseline 4ad3fde

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-baseline.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASELINE_SHA: 4ad3fde264cad4b0d11351bffd9ea1bb9b2f37d1
    steps:
      - name: Check out the original baseline
        uses: actions/checkout@v4
        with:
          ref: 4ad3fde264cad4b0d11351bffd9ea1bb9b2f37d1
          persist-credentials: false
          submodules: recursive

      - name: Verify source and configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASELINE_SHA"
          test -f sdkconfig
          test -f dependencies.lock
          grep -qx 'CONFIG_IDF_TARGET="esp32s3"' sdkconfig
          git ls-files -z main assets | xargs -0 sha256sum > baseline-assets.sha256

      - name: Build with ESP-IDF 5.5.4 on Linux
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/koyoda-idf-home \
            -e CCACHE_DISABLE=1 \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project \
            espressif/idf:v5.5.4 \
            bash -c 'set -euo pipefail; mkdir -p "$HOME"; idf.py --version; idf.py -B build-ci build' \
            2>&1 | tee baseline-build.log

      - name: Package flash files and verify preserved assets
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c baseline-assets.sha256
          git diff --exit-code -- main assets
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil

          build = Path('build-ci')
          out = Path('firmware')
          out.mkdir()
          info = json.loads((build / 'flasher_args.json').read_text())
          for relative in info['flash_files'].values():
              source = (build / relative).resolve()
              if not source.is_relative_to(build.resolve()):
                  raise ValueError(f'Unexpected binary path: {relative}')
              dest = out / relative
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, dest)
          for name in ('flash_args', 'flasher_args.json'):
              shutil.copy2(build / name, out / name)
          for name in ('sdkconfig', 'dependencies.lock', 'partitions.csv', 'baseline-assets.sha256'):
              shutil.copy2(name, out / name)
          (out / 'BUILD-INFO.txt').write_text(
              f"KOYODA baseline: {os.environ['BASELINE_SHA']}\n"
              'ESP-IDF: v5.5.4\nTarget: esp32s3\n'
              'Source face assets verified unchanged. Hardware verification pending.\n'
          )
          (out / 'FLASH-WINDOWS.txt').write_text(
              'Open an ESP-IDF 5.5.4 terminal on Windows.\n'
              'Extract this artifact and change directory to this folder.\n'
              'Close any serial monitor before flashing.\n\n'
              'python -m esptool --chip esp32s3 --port COM11 --baud 460800 '
              '--before default_reset --after hard_reset write_flash @flash_args\n\n'
              'Use the separate binary files and flash_args together.\n'
              'Do not erase the entire flash. Verify face orientation, blink, '
              'charging animation and power confirmation on the device.\n'
          )
          sums = []
          for path in sorted(out.rglob('*')):
              if path.is_file():
                  sums.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(out).as_posix()}')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n')
          PY

      - name: Upload firmware for Windows flashing
        uses: actions/upload-artifact@v4
        with:
          name: KOYODA-baseline-4ad3fde-IDF-5.5.4
          path: firmware/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KOYODA-baseline-build-logs
          path: |
            baseline-build.log
            build-ci/log/
            build-ci/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14
